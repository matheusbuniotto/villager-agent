[project]
name = "villager"
version = "0.1.0"
description = "JIRA-tagged agentic SWE worker"
readme = "README.md"
requires-python = ">=3.12.9,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "typer>=0.24.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<0.12",
  "mypy>=1.10,<2.0",
]

[project.scripts]
villager = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
