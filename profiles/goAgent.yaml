repo_name: goAgent
repo_url: https://github.com/matheusbuniotto/goAgent
sandbox_image: golang:1.23-bookworm
team_name: platform
language: go
build_system: go
service_type: automation
commands:
  install: go mod tidy
  lint: go vet ./...
  test: go test ./...
  format: gofmt -w .
paths:
  owned:
    - cmd/
    - internal/
    - pkg/
  sensitive:
    - .github/
  forbidden:
    - secrets/
  test_locations:
    - internal/
    - pkg/
rules:
  require_tests_for_behavior_change: true
  block_dependency_changes_without_reason: true
  require_human_approval_for_migrations: true
  forbid_generated_code_edits: true
  max_changed_files_before_warning: 8
  max_diff_lines_before_warning: 400
pr:
  template: standard
  labels:
    - villager
  reviewers:
    - platform-team
  required_sections:
    - summary
    - validation
    - risks
  draft_by_default: true
  branch_prefix: villager/
reviewer_groups:
  - platform
known_gotchas:
  - Go modules should be kept tidy.
environment_notes:
  - Go toolchain managed by go.mod.
agent_instructions:
  - Keep changes scoped and validated with targeted tests.
